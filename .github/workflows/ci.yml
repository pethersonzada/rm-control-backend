name: Backend CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: rm_control_test
        options: >-
          --health-cmd "pg_isready -U postgres -d rm_control_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      RM_TEST_POSTGRES_URL: postgresql+psycopg://postgres@127.0.0.1:5432/rm_control_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -s
      - run: python -m compileall -q app migrations
