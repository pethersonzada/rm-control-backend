# Dedicated synthetic-data test API; no paid services or Render database.
services:
  - type: web
    name: rm-control-api-homologacao
    runtime: docker
    plan: free
    region: ohio
    branch: main
    dockerCommand: python render_start.py
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: RM_MODE
        value: operational
      - key: RM_HOSTED
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: RM_HOMOLOGATION_TOKEN
        generateValue: true
      - key: RM_FIREBASE_PROJECT_ID
        value: rm-control-webapp
      - key: RM_ALLOW_LEGACY_TOKEN
        value: "0"
      - key: CORS_ORIGINS
        value: https://rm-control-homologacao.vercel.app
